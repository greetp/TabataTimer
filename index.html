<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Tabata Timer</title>
  <meta name="description" content="Tabata- en HIIT-timer met profielen per gebruiker." />

  <!-- Schermvullend op iPhone, ook onder de notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />

  <!-- Zorgt dat de app zonder Safari-balken opent vanaf het beginscherm -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tabata" />

  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Het icoon voor op het beginscherm. Naast deze regel staat het bestand ook als
       apple-touch-icon.png in de hoofdmap: sommige browsers (zoals Chrome op een iPhone)
       zoeken het daar en tonen anders een grijs icoon. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
